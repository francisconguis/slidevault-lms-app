<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SlideVault LMS" />
  <title>SlideVault LMS — Mobile App</title>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-dark: #312E81;
      --ppt: #EA580C;
      --ppt-bg: #FFEDD5;
      --ex: #0D9488;
      --ex-bg: #CCFBF1;
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text: #0F172A;
      --muted: #64748B;
      --border: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #0F172A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      color: var(--text);
    }

    /* Desktop Phone Frame Wrapper */
    .phone-frame {
      width: 100%;
      max-width: 412px;
      height: 840px;
      max-height: 92vh;
      background: var(--bg);
      border-radius: 38px;
      border: 10px solid #1E293B;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55), 0 0 0 2px #334155;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    @media (max-width: 480px) {
      body {
        padding: 0;
        background: var(--bg);
      }
      .phone-frame {
        max-width: 100%;
        height: 100vh;
        max-height: 100vh;
        border: none;
        border-radius: 0;
        box-shadow: none;
      }
    }

    /* Status Bar */
    .status-bar {
      background: var(--primary-dark);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 20px 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* App Header */
    .app-header {
      background: var(--primary-dark);
      color: #FFFFFF;
      padding: 10px 16px 16px;
      border-bottom-left-radius: 22px;
      border-bottom-right-radius: 22px;
      box-shadow: 0 4px 12px rgba(49, 46, 129, 0.25);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .logo-box {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--primary);
      border: 1px solid #818CF8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .app-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.2px;
    }

    .app-subtitle {
      font-size: 11px;
      color: #C7D2FE;
      margin-top: 2px;
    }

    .role-btn {
      border: 1px solid #818CF8;
      background: var(--primary);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 700;
      padding: 7px 11px;
      border-radius: 999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: transform 0.15s ease;
    }

    .role-btn.student {
      background: #059669;
      border-color: #34D399;
    }

    .role-btn:active {
      transform: scale(0.96);
    }

    /* Action Upload Buttons */
    .quick-actions {
      display: flex;
      gap: 10px;
      padding: 12px 16px 6px;
    }

    .action-btn {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 11px 10px;
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
      transition: opacity 0.15s, transform 0.1s;
    }

    .action-btn:active {
      transform: scale(0.98);
    }

    .btn-ppt {
      background: var(--ppt);
    }

    .btn-ex {
      background: var(--ex);
    }

    /* Search & Filter */
    .search-wrap {
      padding: 6px 16px;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 12px;
      gap: 8px;
    }

    .search-box input {
      border: none;
      outline: none;
      width: 100%;
      font-size: 13px;
      color: var(--text);
      background: transparent;
    }

    .course-chips {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 8px 16px 6px;
      scrollbar-width: none;
    }
    .course-chips::-webkit-scrollbar {
      display: none;
    }

    .chip {
      border: 1px solid #CBD5E1;
      background: #FFFFFF;
      color: #475569;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }

    .chip.active {
      background: var(--primary-dark);
      color: #FFFFFF;
      border-color: var(--primary-dark);
    }

    .chip.add-course {
      background: #EEF2FF;
      color: var(--primary);
      border-color: #C7D2FE;
    }

    /* Main Scroll Content */
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px 24px;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .stat-card {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-left: 4px solid var(--primary);
      border-radius: 12px;
      padding: 10px;
      cursor: pointer;
    }

    .stat-card.ppt {
      border-left-color: var(--ppt);
    }

    .stat-card.ex {
      border-left-color: var(--ex);
    }

    .stat-val {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
    }

    .stat-lbl {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      margin-top: 2px;
    }

    /* Section Header */
    .sec-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 0 8px;
    }

    .sec-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
    }

    .sec-link {
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      background: none;
      border: none;
      cursor: pointer;
    }

    /* Resource Card */
    .res-card {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 13px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s;
    }

    .res-card:hover {
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
    }

    .res-top {
      display: flex;
      gap: 11px;
      align-items: flex-start;
    }

    .res-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .res-icon.ppt {
      background: var(--ppt-bg);
      color: var(--ppt);
    }

    .res-icon.ex {
      background: var(--ex-bg);
      color: var(--ex);
    }

    .res-meta-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3px;
    }

    .course-tag {
      font-size: 11px;
      font-weight: 800;
      color: var(--primary);
    }

    .badge-pill {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
    }

    .badge-pill.ppt {
      background: var(--ppt-bg);
      color: #C2410C;
    }

    .badge-pill.ex {
      background: var(--ex-bg);
      color: #0F766E;
    }

    .res-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.3;
    }

    .res-desc {
      font-size: 12px;
      color: #475569;
      margin-top: 7px;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .res-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #F1F5F9;
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
    }

    .file-name-span {
      max-width: 62%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Empty Box */
    .empty-box {
      background: #FFFFFF;
      border: 1px dashed #CBD5E1;
      border-radius: 14px;
      padding: 22px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 12px;
    }

    /* Bottom Navigation */
    .bottom-nav {
      background: #FFFFFF;
      border-top: 1px solid var(--border);
      display: flex;
      padding: 8px 0 10px;
    }

    .nav-btn {
      flex: 1;
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-btn.active {
      color: var(--primary);
      font-weight: 800;
    }

    .nav-btn.active-ppt {
      color: var(--ppt);
      font-weight: 800;
    }

    .nav-btn.active-ex {
      color: var(--ex);
      font-weight: 800;
    }

    .nav-icon {
      font-size: 19px;
    }

    /* Modal Sheet */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.58);
      display: none;
      align-items: flex-end;
      z-index: 50;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-sheet {
      width: 100%;
      max-height: 88%;
      background: #FFFFFF;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 18px;
      overflow-y: auto;
      animation: slideUp 0.2s ease-out;
    }

    @keyframes slideUp {
      from {
        transform: translateY(40px);
        opacity: 0.5;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .sheet-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .sheet-title {
      font-size: 16px;
      font-weight: 800;
    }

    .close-btn {
      border: none;
      background: #F1F5F9;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      color: #475569;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      margin: 11px 0 5px;
    }

    .form-input,
    .form-select,
    .form-textarea {
      width: 100%;
      border: 1px solid #CBD5E1;
      background: #F8FAFC;
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 13px;
      color: var(--text);
      outline: none;
    }

    .form-textarea {
      min-height: 68px;
      resize: vertical;
    }

    .file-drop {
      border: 2px dashed #818CF8;
      background: #EEF2FF;
      border-radius: 14px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      display: block;
    }

    .file-drop.ppt-active {
      border-color: var(--ppt);
      background: #FFF7ED;
    }

    .file-drop.ex-active {
      border-color: var(--ex);
      background: #F0FDFA;
    }

    .sample-btn {
      margin-top: 7px;
      width: 100%;
      border: 1px solid #CBD5E1;
      background: #F8FAFC;
      color: var(--primary);
      padding: 7px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .submit-btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
      font-weight: 800;
      color: #FFFFFF;
      margin-top: 16px;
      cursor: pointer;
    }

    .file-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #F8FAFC;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px;
      margin: 12px 0;
      gap: 10px;
    }

    .download-btn {
      background: var(--primary);
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .topic-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      font-size: 12px;
      color: #334155;
      border-bottom: 1px solid #F1F5F9;
    }

    .topic-num {
      background: var(--ppt-bg);
      color: #C2410C;
      font-weight: 800;
      font-size: 11px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sub-item {
      background: #F0FDFA;
      border: 1px solid #99F6E4;
      border-radius: 10px;
      padding: 9px 11px;
      margin-top: 7px;
      font-size: 12px;
    }

    .delete-btn {
      width: 100%;
      background: #FEF2F2;
      color: #DC2626;
      border: 1px solid #FECACA;
      padding: 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      margin-top: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="phone-frame">
    <!-- Mobile Status Bar -->
    <div class="status-bar">
      <span id="clockText">11:36 AM</span>
      <span>5G • 100% 🔋</span>
    </div>

    <!-- App Header -->
    <div class="app-header">
      <div class="brand-group">
        <div class="logo-box">📊</div>
        <div>
          <div class="app-title">SlideVault LMS</div>
          <div class="app-subtitle">PPT Presentation & Exercise Storage</div>
        </div>
      </div>
      <button id="roleBtn" class="role-btn" onclick="toggleRole()">
        🎓 Instructor ⇄
      </button>
    </div>

    <!-- Quick Upload Bar -->
    <div class="quick-actions">
      <button class="action-btn btn-ppt" onclick="openModal('pptModal')">
        📤 + Upload PPT
      </button>
      <button class="action-btn btn-ex" onclick="openModal('exModal')">
        📝 + Upload Exercise
      </button>
    </div>

    <!-- Search Bar -->
    <div class="search-wrap">
      <div class="search-box">
        <span>🔍</span>
        <input
          type="text"
          id="searchInput"
          placeholder="Search PPT slides, exercises, or files..."
          oninput="renderApp()"
        />
      </div>
    </div>

    <!-- Course Filter Chips -->
    <div class="course-chips" id="courseChips"></div>

    <!-- Main Scrollable Content -->
    <div class="content-area" id="mainContent"></div>

    <!-- Bottom Tab Bar -->
    <div class="bottom-nav">
      <button class="nav-btn active" id="tab-dashboard" onclick="switchTab('dashboard')">
        <span class="nav-icon">🏠</span>
        <span>Home</span>
      </button>
      <button class="nav-btn" id="tab-ppts" onclick="switchTab('ppts')">
        <span class="nav-icon">📊</span>
        <span>PPT Files</span>
      </button>
      <button class="nav-btn" id="tab-exercises" onclick="switchTab('exercises')">
        <span class="nav-icon">📝</span>
        <span>Exercises</span>
      </button>
      <button class="nav-btn" id="tab-courses" onclick="switchTab('courses')">
        <span class="nav-icon">📁</span>
        <span>Courses</span>
      </button>
    </div>

    <!-- Modal: Upload PPT -->
    <div class="modal-overlay" id="pptModal">
      <div class="modal-sheet">
        <div class="sheet-head">
          <div class="sheet-title">📊 Upload Presentation (PPT)</div>
          <button class="close-btn" onclick="closeModal('pptModal')">✕</button>
        </div>

        <label class="form-label">1. Select Course / Subject</label>
        <select id="pptCourse" class="form-select"></select>

        <label class="form-label">2. Choose PPT / PPTX / PDF File</label>
        <label class="file-drop" id="pptDropLabel">
          <input
            type="file"
            id="pptFileInput"
            accept=".ppt,.pptx,.pdf,.key"
            style="display:none"
            onchange="handlePptFileSelect(event)"
          />
          <div id="pptFileText" style="font-size:13px;font-weight:700;color:#3730A3;">
            📁 Tap to Browse Device for .PPT / .PPTX File
          </div>
          <div style="font-size:11px;color:#6366F1;margin-top:3px;">
            Supports PowerPoint (.ppt, .pptx) & PDF slide decks
          </div>
        </label>
        <button type="button" class="sample-btn" onclick="attachSamplePpt()">
          ✨ Quick Demo: Attach Sample .PPTX Presentation
        </button>

        <label class="form-label">3. Presentation Title *</label>
        <input
          type="text"
          id="pptTitle"
          class="form-input"
          placeholder="e.g., Week 4: Mobile UI Architecture"
        />

        <label class="form-label">4. Number of Slides</label>
        <input
          type="number"
          id="pptSlides"
          class="form-input"
          value="24"
        />

        <label class="form-label">5. Description / Lecture Summary</label>
        <textarea
          id="pptDesc"
          class="form-textarea"
          placeholder="Overview of topics covered in this presentation..."
        ></textarea>

        <label class="form-label">6. Slide Outline (1 per line, optional)</label>
        <textarea
          id="pptTopics"
          class="form-textarea"
          placeholder="Slide 1-5: Introduction&#10;Slide 6-15: Core Concepts"
        ></textarea>

        <button
          class="submit-btn"
          style="background: var(--ppt)"
          onclick="savePptUpload()"
        >
          ☁️ Save & Upload PPT
        </button>
      </div>
    </div>

    <!-- Modal: Upload Exercise -->
    <div class="modal-overlay" id="exModal">
      <div class="modal-sheet">
        <div class="sheet-head">
          <div class="sheet-title">📝 Upload Exercise / Activity</div>
          <button class="close-btn" onclick="closeModal('exModal')">✕</button>
        </div>

        <label class="form-label">1. Select Course / Subject</label>
        <select id="exCourse" class="form-select"></select>

        <label class="form-label">2. Attach Exercise Worksheet / File</label>
        <label class="file-drop" id="exDropLabel">
          <input
            type="file"
            id="exFileInput"
            style="display:none"
            onchange="handleExFileSelect(event)"
          />
          <div id="exFileText" style="font-size:13px;font-weight:700;color:#0F766E;">
            📎 Tap to Attach Exercise File (.pdf, .docx, .pptx, .zip)
          </div>
        </label>
        <button type="button" class="sample-btn" onclick="attachSampleEx()">
          ✨ Quick Demo: Attach Sample Lab Exercise PDF
        </button>

        <label class="form-label">3. Exercise Title *</label>
        <input
          type="text"
          id="exTitle"
          class="form-input"
          placeholder="e.g., Lab Exercise 2: File Upload Interface"
        />

        <div style="display:flex;gap:8px;">
          <div style="flex:2">
            <label class="form-label">Due Date</label>
            <input
              type="text"
              id="exDue"
              class="form-input"
              value="Nov 20, 2026 • 11:59 PM"
            />
          </div>
          <div style="flex:1">
            <label class="form-label">Points</label>
            <input
              type="number"
              id="exPoints"
              class="form-input"
              value="100"
            />
          </div>
        </div>

        <label class="form-label">4. Exercise Instructions</label>
        <textarea
          id="exInst"
          class="form-textarea"
          placeholder="Step-by-step instructions for students..."
        ></textarea>

        <button
          class="submit-btn"
          style="background: var(--ex)"
          onclick="saveExUpload()"
        >
          ☁️ Publish Exercise to LMS
        </button>
      </div>
    </div>

    <!-- Modal: Add Course -->
    <div class="modal-overlay" id="courseModal">
      <div class="modal-sheet">
        <div class="sheet-head">
          <div class="sheet-title">📁 Create New LMS Course</div>
          <button class="close-btn" onclick="closeModal('courseModal')">✕</button>
        </div>

        <label class="form-label">Course Code *</label>
        <input type="text" id="newCourseCode" class="form-input" placeholder="e.g., IT 305" />

        <label class="form-label">Course Name *</label>
        <input type="text" id="newCourseName" class="form-input" placeholder="e.g., Web & Mobile Systems" />

        <label class="form-label">Instructor Name</label>
        <input type="text" id="newCourseInst" class="form-input" placeholder="e.g., Prof. D. Garcia" />

        <button class="submit-btn" style="background: var(--primary)" onclick="saveNewCourse()">
          ➕ Create Course Folder
        </button>
      </div>
    </div>

    <!-- Modal: View Resource Detail -->
    <div class="modal-overlay" id="detailModal">
      <div class="modal-sheet" id="detailSheetContent"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'slidevault_lms_mobile_v1';

    const DEFAULT_STATE = {
      role: 'teacher',
      activeTab: 'dashboard',
      courseFilter: 'ALL',

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return JSON.parse(JSON.stringify(DEFAULT_STATE));
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        alert('File metadata saved! (Large binary attachment kept in memory for this session).');
      }
    }

    function formatSize(bytes) {
      if (!bytes) return '1.5 MB';
      if (bytes < 1024) return bytes + ' B';
      const kb = bytes / 1024;
      if (kb < 1024) return kb.toFixed(1) + ' KB';
      return (kb / 1024).toFixed(2) + ' MB';
    }

    function nowFormatted() {
      const d = new Date();
      return d.toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' }) +

    }

      const reader = new FileReader();
      reader.onload = function(evt) {
        pendingPptFile = {

        document.getElementById('pptDropLabel').classList.add('ppt-active');
        document.getElementById('pptFileText').innerText = `✅ Attached: ${file.name} (${pendingPptFile.size})`;

            </label>
            <button type="button" class="sample-btn" onclick="attachSampleSub()">+ Or Attach Sample Answer File</button>
            <button class="submit-btn" style="background:var(--ex);margin-top:10px;padding:10px;" onclick="submitExerciseWork('${item.id}')">
              ✅ Submit Exercise Output
            </button>
          </div>

          <div class="form-label" style="margin-top:14px;">Submitted Exercise Files (${subs.length})</div>
          ${subs.length ? subs.map(s => `
            <div class="sub-item">
              <div style="font-weight:800;">📄 ${s.fileName} (${s.fileSize})</div>
              <div style="color:#475569;font-size:11px;margin-top:2px;">By ${s.studentName} • ${s.submittedAt}</div>
            </div>
          `).join('') : `<div style="font-size:12px;color:#64748B;">No student submissions yet.</div>`}

          <button class="delete-btn" onclick="deleteResource('${item.id}', 'ex')">🗑 Remove Exercise from Storage</button>
        `;
      }

      openModal('detailModal');
    }

    function handleSubFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      pendingSubFile = {
        name: file.name,
        size: formatSize(file.size)
      };
      document.getElementById('subFileText').innerText = `✅ Ready: ${file.name} (${pendingSubFile.size})`;
    }

    function attachSampleSub() {
      pendingSubFile = {
        name: `Student_Exercise_Solution_${Date.now().toString().slice(-3)}.pdf`,
        size: '910 KB'
      };
      document.getElementById('subFileText').innerText = `✅ Ready: ${pendingSubFile.name} (${pendingSubFile.size})`;
    }

    function submitExerciseWork(exId) {
      if (!pendingSubFile) return alert('Please select an answer file or tap "+ Or Attach Sample Answer File".');
      const studentName = document.getElementById('subStudentName').value.trim() || 'Student User';
      const ex = state.exercises.find(e => e.id === exId);
      if (!ex) return;
      ex.submissions = ex.submissions || [];
      ex.submissions.unshift({
        id: 'sub-' + Date.now(),
        studentName,
        fileName: pendingSubFile.name,
        fileSize: pendingSubFile.size,
        submittedAt: nowFormatted()
      });
      saveState();
      openDetail(exId, 'ex');
      renderApp();
    }

    function downloadResource(id, type) {
      const item = type === 'ppt'
        ? state.presentations.find(p => p.id === id)
        : state.exercises.find(e => e.id === id);
      if (!item) return;

      if (item.dataUrl) {
        const a = document.createElement('a');
        a.href = item.dataUrl;
        a.download = item.fileName;
        a.click();
      } else {
        const blob = new Blob(
          [`SlideVault LMS Stored File\nTitle: ${item.title}\nFile: ${item.fileName}\nUploaded: ${item.uploadedAt}`],
          { type: 'text/plain;charset=utf-8' }
        );
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = item.fileName + '.txt';
        a.click();
        URL.revokeObjectURL(url);
      }
    }

    function deleteResource(id, type) {
      if (type === 'ppt') {
        state.presentations = state.presentations.filter(p => p.id !== id);
      } else {
        state.exercises = state.exercises.filter(e => e.id !== id);
      }
      saveState();
      closeModal('detailModal');
      renderApp();
    }

    function resetDemoData() {
      state = JSON.parse(JSON.stringify(DEFAULT_STATE));
      saveState();
      renderApp();
    }

    renderApp();
  </script>
</body>
</html>
